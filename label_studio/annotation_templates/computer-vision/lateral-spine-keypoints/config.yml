title: Lateral Spine Keypoint Annotation
type: community
group: Computer Vision
order: 10040
image: /static/templates/spine.png
details: |
  <h1>Annotate Lateral spine vertebral corner keypoints</h1>
  <dl>
    <dt>What it does</dt>
    <dd>Annotate 50 vertebral corner keypoints across T1 through Sacrum on Lateral X-ray images. Each vertebra is labeled with 4 corner points (Upper-Anterior, Upper-Posterior, Lower-Anterior, Lower-Posterior), grouped by vertebra level with distinct colors for quick visual identification.</dd>
    <dt>Keypoints per vertebra</dt>
    <dd>T1–L5: 4 corners each (UA/UP/DA/DP). Sacrum: 2 points (SUA/SUP). Total 50 labels across 18 groups.</dd>
    <dt>Color coding</dt>
    <dd>Each vertebral level is assigned a unique color, forming a rainbow gradient from upper thoracic (red) through mid-thoracic (green/cyan/blue) to lower thoracic/lumbar (purple/pink) and sacrum (light pink).</dd>
  </dl>
