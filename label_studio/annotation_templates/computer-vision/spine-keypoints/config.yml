title: AP/PA Spine Keypoint Annotation
type: community
group: Computer Vision
order: 10030
image: /static/templates/spine.png
details: |
  <h1>Annotate AP/PA spine vertebral corner keypoints</h1>
  <dl>
    <dt>What it does</dt>
    <dd>Annotate 74 vertebral corner keypoints across C7 through Sacrum on AP/PA X-ray images. Each vertebra is labeled with 4 corner points (Upper-Left, Upper-Right, Lower-Left, Lower-Right), grouped by vertebra level with distinct colors for quick visual identification.</dd>
    <dt>Keypoints per vertebra</dt>
    <dd>C7–L5: 4 corners each (UL/UR/DL/DR). Sacrum: 2 points (SUL/SUR). Total 74 labels across 19 groups.</dd>
    <dt>Color coding</dt>
    <dd>Each vertebral level is assigned a unique color, forming a rainbow gradient from cervical (red) through thoracic (green/cyan/blue) to lumbar (purple/pink) and sacrum (light pink).</dd>
  </dl>
